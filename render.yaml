databases:
  - name: spec-ed-progress-db
    plan: free
    region: virginia

services:
  - type: web
    name: spec-ed-progress-tracker
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spec-ed-progress-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_VERSION
        value: 20.17.0
